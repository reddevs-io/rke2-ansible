---
# RKE2 Cluster Inventory Example (YAML format)
# Copy this file and modify for your environment

all:
  children:
    rke2_cluster:
      children:
        rke2_servers:
          hosts:
            # RKE2 server/control-plane nodes
            # These nodes run the RKE2 server component and have kubectl access
            rke2-server-01:
              ansible_host: 192.168.1.10
            rke2-server-02:
              ansible_host: 192.168.1.11
            rke2-server-03:
              ansible_host: 192.168.1.12
        rke2_agents:
          hosts:
            # RKE2 agent/worker nodes
            # These nodes run the RKE2 agent component only
            rke2-agent-01:
              ansible_host: 192.168.1.20
            rke2-agent-02:
              ansible_host: 192.168.1.21
            rke2-agent-03:
              ansible_host: 192.168.1.22
        rke2_new_agents:
          hosts:
            # New worker nodes to join the cluster.
            # Move them under rke2_agents after a successful join.
            # rke2-new-worker-01:
            #   ansible_host: 192.168.1.30
      vars:
        # Common variables for all RKE2 nodes
        ansible_user: rke2admin
        ansible_ssh_private_key_file: ~/.ssh/id_rsa
        ansible_python_interpreter: /usr/bin/python3
