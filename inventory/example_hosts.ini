# RKE2 Cluster Inventory Example
# Copy this file and modify for your environment

[rke2_servers]
# RKE2 server/control-plane nodes
# These nodes run the RKE2 server component and have kubectl access
rke2-server-01 ansible_host=192.168.1.10
rke2-server-02 ansible_host=192.168.1.11
rke2-server-03 ansible_host=192.168.1.12

[rke2_agents]
# RKE2 agent/worker nodes
# These nodes run the RKE2 agent component only
rke2-agent-01 ansible_host=192.168.1.20
rke2-agent-02 ansible_host=192.168.1.21
rke2-agent-03 ansible_host=192.168.1.22

[rke2_cluster:children]
rke2_servers
rke2_agents

[rke2_cluster:vars]
# Common variables for all RKE2 nodes
ansible_user=rke2admin
ansible_ssh_private_key_file=~/.ssh/id_rsa
ansible_python_interpreter=/usr/bin/python3
