---
# defaults file for rke2_prepare

# When true, the prepare role (apt dist-upgrade + reboot) runs even if the
# version check decided to skip the RKE2 upgrade. When false (default), the
# prepare role is skipped on no-op runs to avoid unnecessary reboots.
prepare_always_runs: false

# Apt cache validity time in seconds
apt_cache_valid_time: 3600

# Reboot settings
reboot_timeout: 600
reboot_connect_timeout: 5
reboot_pre_delay: 0
reboot_post_delay: 30

# Wait for connection settings after reboot
wait_for_connection_delay: 10
wait_for_connection_timeout: 300
