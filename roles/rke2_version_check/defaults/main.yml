---
# defaults file for rke2_version_check

# RKE2 type (server or agent)
rke2_type: server

# Target RKE2 version (empty for latest)
rke2_version: ""

# GitHub API URL for RKE2 releases
rke2_github_api_url: "https://api.github.com/repos/rancher/rke2/releases/latest"

# Optional GitHub token to raise API rate limit from 60 to 5000 req/hr.
# Leave empty for unauthenticated access.
github_token: ""

# When false (default), the role refuses to downgrade RKE2. Set to true to
# allow downgrade (e.g. for rollback scenarios).
allow_downgrade: false

