---
# tasks file for rke2_node_drain

- name: Cordon node
  command: kubectl cordon {{ inventory_hostname }}
  delegate_to: localhost
  become: false
  register: cordon_result
  changed_when: "'cordoned' in cordon_result.stdout"
  when:
    - drain_enabled | bool
    - not (rke2_skip_upgrade | default(false))

- name: Drain node
  command: >
    kubectl drain {{ inventory_hostname }}
    {{ drain_ignore_daemonsets | bool | ternary('--ignore-daemonsets', '') }}
    {{ drain_force | bool | ternary('--force', '') }}
    {{ drain_delete_emptydir_data | bool | ternary('--delete-emptydir-data', '') }}
    --timeout={{ drain_timeout }}s --grace-period={{ drain_grace_period }}
  delegate_to: localhost
  become: false
  register: drain_result
  changed_when: >-
    'evicting' in (drain_result.stdout | default(''))
    or 'deleted' in (drain_result.stdout | default(''))
  ignore_errors: true
  when:
    - drain_enabled | bool
    - not (rke2_skip_upgrade | default(false))

- name: Check drain result
  fail:
    msg: "Failed to drain node {{ inventory_hostname }}: {{ drain_result.stderr }}"
  when:
    - drain_enabled | bool
    - not (rke2_skip_upgrade | default(false))
    - drain_result.rc != 0
    - "'cannot delete DaemonSet-managed Pods' not in drain_result.stderr"

- name: Report in-place upgrade (drain disabled)
  debug:
    msg: >-
      drain_enabled is false: {{ inventory_hostname }} was not cordoned or
      drained. Its pods will be restarted in place when rke2-{{ rke2_type }}
      restarts.
  when: not (drain_enabled | bool)
