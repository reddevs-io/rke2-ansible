---
# RKE2 Kubernetes Cluster Upgrade Playbook
# Upgrades server nodes first (sequentially), then agent nodes (sequentially)

- name: Preflight Checks
  hosts: localhost
  become: false
  gather_facts: false
  tasks:
    - name: Run preflight validation
      include_role:
        name: rke2_preflight


- name: Upgrade RKE2 Server Nodes
  hosts: rke2_servers
  become: true
  serial: 1
  any_errors_fatal: true
  vars:
    rke2_type: server

  tasks:
    - name: Check RKE2 version
      include_role:
        name: rke2_version_check

    - name: Drain node
      include_role:
        name: rke2_node_drain

    - name: Prepare system
      include_role:
        name: rke2_prepare
      when: >-
        (not (rke2_skip_upgrade | default(false)))
        or (prepare_always_runs | bool)

    - name: Install RKE2
      include_role:
        name: rke2_install

    - name: Restore node
      include_role:
        name: rke2_node_restore


- name: Upgrade RKE2 Agent Nodes
  hosts: rke2_agents
  become: true
  serial: 1
  vars:
    rke2_type: agent

  tasks:
    - name: Check RKE2 version
      include_role:
        name: rke2_version_check

    - name: Drain node
      include_role:
        name: rke2_node_drain

    - name: Prepare system
      include_role:
        name: rke2_prepare
      when: >-
        (not (rke2_skip_upgrade | default(false)))
        or (prepare_always_runs | bool)

    - name: Install RKE2
      include_role:
        name: rke2_install

    - name: Restore node
      include_role:
        name: rke2_node_restore


- name: Post-Upgrade Verification
  hosts: localhost
  become: false
  gather_facts: false
  tasks:
    - name: Get cluster nodes status
      command: kubectl get nodes -o wide
      register: nodes_status
      changed_when: false
      check_mode: false

    - name: Display cluster nodes status
      debug:
        var: nodes_status.stdout_lines

    - name: Verify all nodes are Ready
      shell: kubectl get nodes -o jsonpath='{.items[*].status.conditions[?(@.type=="Ready")].status}'
      register: all_ready
      changed_when: false
      check_mode: false

    - name: Fail if any node is not Ready
      fail:
        msg: "One or more nodes are not in Ready state"
      when: "'False' in all_ready.stdout"

    - name: Collect running kubelet versions
      shell: >-
        kubectl get nodes -o
        jsonpath='{range .items[*]}{.metadata.name}{"="}{.status.nodeInfo.kubeletVersion}{"\n"}{end}'
      register: node_versions_raw
      changed_when: false
      check_mode: false

    - name: Display node versions
      debug:
        var: node_versions_raw.stdout_lines

    - name: Determine the target kubelet version
      # Compare on the prefix before any '+': kubeletVersion may or may not
      # carry the RKE2 build suffix depending on the release (RKE2 1.36 reports
      # v1.36.4+rke2r1, older releases reported a bare v1.28.4).
      # Read the fact from any host that ran rke2_version_check rather than
      # assuming rke2_servers[0] did: under --limit that host may not have run,
      # leaving the fact undefined and defaulting the target to an empty string.
      set_fact:
        target_kubelet_version: >-
          {{ ((groups.rke2_servers | default([])) + (groups.rke2_agents | default([])))
             | map('extract', hostvars, 'rke2_target_version')
             | select('defined') | reject('equalto', '') | list
             | first | default('') }}

    - name: Fail if the target version could not be determined
      # Without this guard an empty target makes the assertion below pass
      # vacuously, reporting a successful upgrade having verified nothing.
      fail:
        msg: >-
          Could not determine the target RKE2 version: no host recorded
          rke2_target_version. Refusing to report success without verifying it.
      when: (target_kubelet_version | trim | split('+') | first) == ''

    - name: Verify all nodes report the target version
      # Every line must match. A substring search over the whole output only
      # proves that *some* node reached the target, not all of them.
      assert:
        that:
          - nodes_off_target | length == 0
        fail_msg: >-
          These nodes do not report the target kubelet version
          {{ target_kubelet_version | trim | split('+') | first }}: {{ nodes_off_target }}
        success_msg: >-
          All {{ node_versions_raw.stdout_lines | length }} nodes report kubelet
          version {{ target_kubelet_version | trim | split('+') | first }}
      vars:
        nodes_off_target: >-
          {{ node_versions_raw.stdout_lines
             | reject('search', '=' ~ (target_kubelet_version | trim | split('+') | first | regex_escape) ~ '(\+|$)')
             | list }}

    - name: Display upgrade complete message
      debug:
        msg: "RKE2 cluster upgrade completed successfully!"
