---
# RKE2 Kubernetes Cluster Upgrade Playbook
# Upgrades server nodes first (sequentially), then agent nodes (sequentially)

- name: Preflight Checks
  hosts: localhost
  become: false
  gather_facts: false
  tasks:
    - name: Run preflight validation
      include_role:
        name: rke2_preflight


- name: Upgrade RKE2 Server Nodes
  hosts: rke2_servers
  become: true
  serial: 1
  any_errors_fatal: true
  vars:
    rke2_type: server

  tasks:
    - name: Check RKE2 version
      include_role:
        name: rke2_version_check

    - name: Prepare system
      include_role:
        name: rke2_prepare
      when: >-
        (not (rke2_skip_upgrade | default(false)))
        or (prepare_always_runs | bool)

    - name: Drain node
      include_role:
        name: rke2_node_drain

    - name: Install RKE2
      include_role:
        name: rke2_install

    - name: Restore node
      include_role:
        name: rke2_node_restore


- name: Upgrade RKE2 Agent Nodes
  hosts: rke2_agents
  become: true
  serial: 1
  vars:
    rke2_type: agent

  tasks:
    - name: Check RKE2 version
      include_role:
        name: rke2_version_check

    - name: Prepare system
      include_role:
        name: rke2_prepare
      when: >-
        (not (rke2_skip_upgrade | default(false)))
        or (prepare_always_runs | bool)

    - name: Drain node
      include_role:
        name: rke2_node_drain

    - name: Install RKE2
      include_role:
        name: rke2_install

    - name: Restore node
      include_role:
        name: rke2_node_restore


- name: Post-Upgrade Verification
  hosts: localhost
  become: false
  gather_facts: false
  tasks:
    - name: Get cluster nodes status
      command: kubectl get nodes -o wide
      register: nodes_status
      changed_when: false
      check_mode: false

    - name: Display cluster nodes status
      debug:
        var: nodes_status.stdout_lines

    - name: Verify all nodes are Ready
      shell: kubectl get nodes -o jsonpath='{.items[*].status.conditions[?(@.type=="Ready")].status}'
      register: all_ready
      changed_when: false
      check_mode: false

    - name: Fail if any node is not Ready
      fail:
        msg: "One or more nodes are not in Ready state"
      when: "'False' in all_ready.stdout"

    - name: Collect running kubelet versions
      shell: >-
        kubectl get nodes -o
        jsonpath='{range .items[*]}{.metadata.name}{"="}{.status.nodeInfo.kubeletVersion}{"\n"}{end}'
      register: node_versions_raw
      changed_when: false
      check_mode: false

    - name: Display node versions
      debug:
        var: node_versions_raw.stdout_lines

    - name: Verify all nodes report the target version
      # kubeletVersion reports the Kubernetes version (e.g. v1.28.4) without the
      # RKE2 build suffix (+rke2r1), so compare on the prefix before any '+'.
      assert:
        that:
          - node_versions_raw.stdout is search(target_kubelet_version)
        fail_msg: >-
          Not all nodes report the target kubelet version {{ target_kubelet_version }}.
          Node versions:
          {{ node_versions_raw.stdout_lines }}
      vars:
        target_kubelet_version: "{{ (hostvars[groups.rke2_servers[0]].rke2_target_version | default('')).split('+')[0] }}"

    - name: Display upgrade complete message
      debug:
        msg: "RKE2 cluster upgrade completed successfully!"
